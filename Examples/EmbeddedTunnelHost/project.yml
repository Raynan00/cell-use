name: EmbeddedTunnelHost
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CELL_USE_BUNDLE_ID: com.example.celluse.host
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  CellUse:
    path: ../..
targets:
  EmbeddedTunnelHost:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: CellUse
        product: CellUseTunnel
      - target: CellUseTunnelExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CELL_USE_BUNDLE_ID)
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: cell-use tunnel host
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_ENTITLEMENTS: ../../Templates/EmbeddedTunnel/Host.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
  CellUseTunnelExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ../../Templates/EmbeddedTunnel/PacketTunnelProvider.swift
    dependencies:
      - package: CellUse
        product: CellUseTunnel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CELL_USE_BUNDLE_ID).tunnel
        INFOPLIST_FILE: ../../Templates/EmbeddedTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: ../../Templates/EmbeddedTunnel/Tunnel.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  EmbeddedTunnelHost:
    build:
      targets:
        EmbeddedTunnelHost: all
