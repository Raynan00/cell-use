name: CellUseDemo
options:
  deploymentTarget:
    iOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "27.0"
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
packages:
  CellUse:
    path: .
  CellUseNative:
    path: Runtime
  DeviceHubKit:
    path: .build/devicehub/Packages/DeviceHubKit
  PlaylistMoveCore:
    path: Examples/PlaylistMove
targets:
  DeviceHubPrivateMedia:
    type: framework
    platform: iOS
    sources:
      - path: .build/devicehub/Sources/DeviceHubPrivateMedia/DHAVConferenceReceiver.mm
      - path: .build/devicehub/Sources/DeviceHubPrivateMedia/include
        headerVisibility: public
    dependencies:
      - sdk: Foundation.framework
      - sdk: QuartzCore.framework
    settings:
      base:
        CLANG_CXX_LANGUAGE_STANDARD: "c++20"
        CLANG_ENABLE_MODULES: YES
        CLANG_ENABLE_OBJC_ARC: YES
        DEFINES_MODULE: YES
        GENERATE_INFOPLIST_FILE: YES
        MACH_O_TYPE: staticlib
        PRODUCT_MODULE_NAME: DeviceHubPrivateMedia
        SKIP_INSTALL: YES
  DeviceHubLive:
    type: library.static
    platform: iOS
    sources:
      - path: .build/devicehub/Sources/DeviceHubLive
    dependencies:
      - framework: .build/devicehub/Rust/Artifacts/DeviceHubFFI.xcframework
        embed: false
        link: false
      - target: DeviceHubPrivateMedia
        link: false
      - package: DeviceHubKit
        product: DeviceHubCore
        link: false
      - package: DeviceHubKit
        product: DeviceHubClient
        link: false
      - package: DeviceHubKit
        product: DeviceHubDiagnostics
        link: false
      - package: DeviceHubKit
        product: DeviceHubPersistence
        link: false
      - package: DeviceHubKit
        product: DeviceHubTransport
        link: false
    settings:
      base:
        DEFINES_MODULE: YES
        PRODUCT_MODULE_NAME: DeviceHubLive
        SKIP_INSTALL: YES
        SWIFT_INSTALL_OBJC_HEADER: NO
  CellUseDemo:
    type: application
    platform: iOS
    sources:
      - path: Examples/CellUseDemo
      - path: Runtime/Sources/PhoneProbeRouting
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
      - path: LICENSE
        buildPhase: resources
      - path: NOTICE
        buildPhase: resources
      - path: Licenses/DeviceHub-MIT.txt
        buildPhase: resources
      - path: .build/devicehub/Licenses
        buildPhase: resources
        type: folder
    configFiles:
      Debug: Config/Project.xcconfig
      Release: Config/Project.xcconfig
    dependencies:
      - target: DeviceHubLive
        embed: false
      - target: DeviceHubPrivateMedia
        embed: false
      - framework: .build/devicehub/Rust/Artifacts/DeviceHubFFI.xcframework
        embed: false
      - package: CellUseNative
        product: PhoneProbeCore
      - package: CellUseNative
        product: CellUseRuntime
      - package: CellUse
      - package: DeviceHubKit
        product: DeviceHubMedia
      - package: DeviceHubKit
        product: DeviceHubCore
      - package: DeviceHubKit
        product: DeviceHubClient
      - package: DeviceHubKit
        product: DeviceHubDiagnostics
      - package: DeviceHubKit
        product: DeviceHubPersistence
      - package: DeviceHubKit
        product: DeviceHubTransport
    settings:
      base:
        INFOPLIST_FILE: Config/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: $(PROBE_BUNDLE_ID)
        DEVELOPMENT_TEAM: $(PROBE_TEAM)
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
  PlaylistMove:
    type: application
    platform: iOS
    sources:
      - path: Examples/PlaylistMove/App
      - path: Runtime/Sources/PhoneProbeRouting
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
      - path: LICENSE
        buildPhase: resources
      - path: Licenses/DeviceHub-MIT.txt
        buildPhase: resources
      - path: .build/devicehub/Licenses
        buildPhase: resources
        type: folder
    dependencies:
      - target: DeviceHubLive
        embed: false
      - target: DeviceHubPrivateMedia
        embed: false
      - framework: .build/devicehub/Rust/Artifacts/DeviceHubFFI.xcframework
        embed: false
      - package: PlaylistMoveCore
      - package: CellUse
      - package: CellUseNative
        product: CellUseRuntime
      - package: CellUseNative
        product: PhoneProbeCore
      - package: DeviceHubKit
        product: DeviceHubMedia
      - package: DeviceHubKit
        product: DeviceHubCore
      - package: DeviceHubKit
        product: DeviceHubClient
      - package: DeviceHubKit
        product: DeviceHubDiagnostics
      - package: DeviceHubKit
        product: DeviceHubPersistence
      - package: DeviceHubKit
        product: DeviceHubTransport
    settings:
      base:
        INFOPLIST_FILE: Examples/PlaylistMove/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.raynan.playlistmove
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
schemes:
  CellUseDemo:
    build:
      targets:
        CellUseDemo: all
  PlaylistMove:
    build:
      targets:
        PlaylistMove: all
