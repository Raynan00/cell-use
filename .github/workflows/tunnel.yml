name: Validate embedded tunnel
on:
  workflow_dispatch:
  push:
    branches: [main, codex/embedded-tunnel]
    paths:
      - Sources/CellUseTunnel/**
      - Tests/CellUseTunnelTests/**
      - Templates/EmbeddedTunnel/**
      - Examples/EmbeddedTunnelHost/**
      - Package.swift
      - Scripts/build-embedded-tunnel.sh
      - Scripts/verify-embedded-tunnel.py
      - .github/workflows/tunnel.yml
  pull_request:
    paths:
      - Sources/CellUseTunnel/**
      - Tests/CellUseTunnelTests/**
      - Templates/EmbeddedTunnel/**
      - Examples/EmbeddedTunnelHost/**
      - Package.swift
      - Scripts/build-embedded-tunnel.sh
      - Scripts/verify-embedded-tunnel.py
      - .github/workflows/tunnel.yml
permissions:
  contents: read
jobs:
  tunnel:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: swift test
      - run: bash Scripts/build-embedded-tunnel.sh
